[project]
name = "jyoken-voice-conversation"
version = "0.1.0"
description = "音声での会話を可能にするAIシステム - Deepgram, Gemini, ElevenLabsを使用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk==4.8.1",
    "elevenlabs==1.59",
    "google-generativeai>=0.8.5",
    "ipython>=9.6.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
]
